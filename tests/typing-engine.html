<!doctype html><meta charset="utf-8"><title>Typing Engine Tests</title><pre id="out"></pre><script src="../js/engine.js"></script><script>const out=document.querySelector('#out');let pass=0,fail=0;function test(name,fn){try{fn();out.textContent+=`✓ ${name}\n`;pass++}catch(e){out.textContent+=`✗ ${name}: ${e.message}\n`;fail++}}function eq(a,b){if(a!==b)throw Error(`${a} !== ${b}`)}test('correct key advances',()=>{const s=new KQ.TypingSession('ab');eq(s.input('a'),'correct');eq(s.pos,1);eq(s.states[0],KQ.CORRECT)});test('wrong key stays wrong and advances',()=>{const s=new KQ.TypingSession('ab');eq(s.input('x'),'wrong');eq(s.pos,1);eq(s.typedChars[0],'x');eq(s.states[0],KQ.WRONG);eq(s.stats().mistakes,1)});test('typing continues after mistake',()=>{const s=new KQ.TypingSession('ab');s.input('x');s.input('b');eq(s.pos,2);eq(s.states[1],KQ.CORRECT)});test('backspace removes latest visual state',()=>{const s=new KQ.TypingSession('ab');s.input('x');s.backspace();eq(s.pos,0);eq(s.typedChars[0],'');eq(s.states[0],KQ.PENDING);eq(s.stats().mistakes,1)});test('accuracy keeps historical mistakes',()=>{const s=new KQ.TypingSession('ab');s.input('x');s.backspace();s.input('a');eq(s.stats().mistakes,1);eq(s.stats().accuracy,50)});test('session completes at end',()=>{const s=new KQ.TypingSession('a');eq(s.input('a'),'complete');eq(s.done,true)});out.textContent+=`\n${pass} passed · ${fail} failed`;if(fail)document.title='FAIL — Typing Engine Tests';else document.title='PASS — Typing Engine Tests';</script>
