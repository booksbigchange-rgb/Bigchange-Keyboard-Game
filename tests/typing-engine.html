<!doctype html>
<meta charset="utf-8">
<title>Typing Engine Tests</title>
<pre id="out"></pre>
<script src="../js/engine.js"></script>
<script>
const out=document.querySelector('#out');let pass=0,fail=0;
function test(name,fn){try{fn();out.textContent+=`✓ ${name}\n`;pass++}catch(e){out.textContent+=`✗ ${name}: ${e.message}\n`;fail++}}
function eq(a,b){if(a!==b)throw Error(`${a} !== ${b}`)}

test('correct key advances',()=>{const s=new KQ.TypingSession('ab');eq(s.input('a'),'correct');eq(s.pos,1)});
test('wrong substitution advances without blocking',()=>{const s=new KQ.TypingSession('ab');eq(s.input('x'),'wrong');eq(s.pos,1);eq(s.input('b'),'complete');eq(s.stats().mistakes,1)});
test('single inserted character recovers alignment',()=>{const s=new KQ.TypingSession('a b');s.input('a');s.input('p');eq(s.input(' '),'corrected');eq(s.input('b'),'complete');eq(s.stats().mistakes,1)});
test('multiple inserted characters can recover alignment',()=>{const s=new KQ.TypingSession('a bc');s.input('a');s.input('x');s.input('y');eq(s.input(' '),'corrected');eq(s.input('b'),'corrected');eq(s.input('c'),'complete');eq(s.stats().mistakes,2)});
test('short omission resyncs ahead',()=>{const s=new KQ.TypingSession('abcde');s.input('a');eq(s.input('d'),'resynced');eq(s.pos,4);eq(s.stats().mistakes,2);eq(s.input('e'),'complete')});
test('backspace revisits previous position',()=>{const s=new KQ.TypingSession('ab');s.input('x');eq(s.backspace(),true);eq(s.pos,0);eq(s.input('a'),'correct')});
test('accuracy stays bounded',()=>{const s=new KQ.TypingSession('abc');s.input('x');s.input('b');s.input('c');const a=s.stats().accuracy;if(a<0||a>100)throw Error('accuracy out of range')});
test('input ignored after completion',()=>{const s=new KQ.TypingSession('a');s.input('a');eq(s.input('x'),'ignored')});

out.textContent+=`\n${pass} passed · ${fail} failed`;
document.title=(fail?'FAIL':'PASS')+' — Typing Engine Tests';
</script>
