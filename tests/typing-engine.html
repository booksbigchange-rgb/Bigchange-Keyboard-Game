<!doctype html><meta charset="utf-8"><title>Typing Engine Tests</title><pre id="out"></pre><script src="../js/engine.js"></script><script>const out=document.querySelector('#out');let pass=0,fail=0;function test(name,fn){try{fn();out.textContent+=`✓ ${name}\n`;pass++}catch(e){out.textContent+=`✗ ${name}: ${e.message}\n`;fail++}}function eq(a,b){if(a!==b)throw Error(`${a} !== ${b}`)}test('correct key advances',()=>{const s=new KQ.TypingSession('ab');eq(s.input('a'),'correct');eq(s.pos,1);eq(s.states[0],KQ.CORRECT)});test('wrong key stays wrong and advances',()=>{const s=new KQ.TypingSession('ab');eq(s.input('x'),'wrong');eq(s.pos,1);eq(s.typedChars[0],'x');eq(s.states[0],KQ.WRONG);eq(s.stats().mistakes,1)});test('typing continues after mistake',()=>{const s=new KQ.TypingSession('ab');s.input('x');s.input('b');eq(s.pos,2);eq(s.states[1],KQ.CORRECT)});test('multiple mistakes retain positions',()=>{const s=new KQ.TypingSession('abcd');s.input('x');s.input('y');s.input('c');eq(s.states[0],KQ.WRONG);eq(s.states[1],KQ.WRONG);eq(s.states[2],KQ.CORRECT);eq(s.stats().mistakes,2)});test('space is evaluated normally',()=>{const s=new KQ.TypingSession('a b');s.input('a');s.input(' ');eq(s.states[1],KQ.CORRECT)});test('wrong space is recorded',()=>{const s=new KQ.TypingSession('a b');s.input('a');s.input('x');eq(s.states[1],KQ.WRONG);eq(s.stats().mistakes,1)});test('backspace removes latest visual state',()=>{const s=new KQ.TypingSession('ab');s.input('x');s.backspace();eq(s.pos,0);eq(s.typedChars[0],'');eq(s.states[0],KQ.PENDING);eq(s.stats().mistakes,1)});test('backspace cannot move before zero',()=>{const s=new KQ.TypingSession('a');eq(s.backspace(),false);eq(s.pos,0)});test('accuracy keeps historical mistakes',()=>{const s=new KQ.TypingSession('ab');s.input('x');s.backspace();s.input('a');eq(s.stats().mistakes,1);eq(s.stats().accuracy,50)});test('accuracy starts at 100',()=>{const s=new KQ.TypingSession('abc');eq(s.stats().accuracy,100)});test('session completes at end',()=>{const s=new KQ.TypingSession('a');eq(s.input('a'),'complete');eq(s.done,true)});test('input ignored after completion',()=>{const s=new KQ.TypingSession('a');s.input('a');eq(s.input('x'),'ignored');eq(s.pos,1)});test('progress stays bounded',()=>{const s=new KQ.TypingSession('a');eq(s.stats().progress,0);s.input('a');eq(s.stats().progress,1)});out.textContent+=`\n${pass} passed · ${fail} failed`;document.title=(fail?'FAIL':'PASS')+' — Typing Engine Tests';</script>
